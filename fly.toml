app = "healthslip-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8005
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[env]
  ENVIRONMENT = "production"
  FALLBACK_TO_SQLITE = "True"
  DEV_OTP_SANDBOX_MODE = "True"

